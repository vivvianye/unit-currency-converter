<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конвертер валют і одиниць</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Конвертер валют і одиниць</h1>
    </header>

<main>
    <section class="types">
        <h2>Вибір типу конвертації</h2>
        <button type="button">Валюта</button>
        <button type="button">Довжина</button>
        <button type="button">Вага</button>
    </section>

    <section>
        <h2>Форма конвертації</h2>
        <form>
            <label for="val">Значення:</label>
            <input type="text" id="val" name="val">

            <div class="fields">
                <label for="from">З:</label>
                <select id="from" name="from">
                    <option value="usd">USD</option>
                    <option value="eur">KG</option>
                </select>
                <button type="button" class="swap-btn" aria-label="Поміняти місцями">⇄</button>

                <label for="to">В:</label>
                <select id="to" name="to">
                    <option value="uah">UAH</option>
                    <option value="usd">GR</option>
                </select>
            </div>

            <button type="submit" class="submit-btn">Конвертувати</button>
        </form>

        <section class="result">
            <h3>Результат: <span>0.00</span></h3>
        </section>
    </section>
</main>

<footer>
    <p>Курси валют є орієнтовними. &copy; 2026</p>
</footer>

<script src="js/app.js"></script>
</body>
</html>
